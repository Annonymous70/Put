<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Quest - Game Belajar Informatika</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            width: 450px;
            text-align: center;
        }
        h1 {
            color: #2d3436;
            margin-bottom: 10px;
        }
        p {
            color: #636e72;
        }
        button {
            background: #0984e3;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background: #74b9ff;
        }
        input {
            padding: 12px;
            width: 90%;
            margin: 10px 0;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            font-size: 16px;
        }
        .hidden {
            display: none;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2d3436;
            background: #dfe6e9;
            padding: 10px;
            border-radius: 6px;
        }
        .option-btn {
            background: #00b894;
        }
        .option-btn:hover {
            background: #55efc4;
            color: #2d3436;
        }
        .save-btn {
            background: #fdcb6e;
            color: #2d3436;
        }
        .save-btn:hover {
            background: #ffeaa7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Informatika Quest 🚀</h1>
        
        <div id="start-screen">
            <p>Uji pemahaman dasar informatika Anda mulai dari biner, logika, jaringan, hingga algoritma!</p>
            <input type="text" id="player-name" placeholder="Masukkan Nama Anda">
            <button onclick="startGame()">Mulai Game Baru</button>
            <button onclick="loadGame()" style="background: #6c5ce7;">Muat Game Tersimpan</button>
        </div>
        
        <div id="game-screen" class="hidden">
            <div class="stats">
                <span id="display-level">Level: 1</span>
                <span id="display-score">Skor: 0</span>
            </div>
            <h3 id="question-title">Pertanyaan</h3>
            <p id="question-text">Teks pertanyaan...</p>
            <div id="options-container"></div>
            <button class="save-btn" onclick="saveGame()">Simpan Progress Game</button>
        </div>
    </div>

    <script>
        // Data Pertanyaan Informatika Dasar
        const levels = [
            {
                title: "Level 1: Sistem Biner",
                question: "Berapa nilai desimal dari angka biner 101?",
                options: ["3", "5", "6", "4"],
                answer: "5"
            },
            {
                title: "Level 2: Gerbang Logika",
                question: "Jika A = True (1) dan B = False (0), berapakah hasil dari operasi logika (A AND B)?",
                options: ["True", "False"],
                answer: "False"
            },
            {
                title: "Level 3: Jaringan Komputer",
                question: "Perangkat jaringan mana yang berfungsi untuk meneruskan paket data antar jaringan berbeda (termasuk ke internet)?",
                options: ["Switch", "Hub", "Router", "Kabel UTP"],
                answer: "Router"
            },
            {
                title: "Level 4: Algoritma Dasar",
                question: "Manakah urutan langkah logis (algoritma) yang benar saat menyalakan komputer?",
                options: [
                    "Tekan tombol power -> Hubungkan ke listrik -> Tunggu OS loading",
                    "Hubungkan ke listrik -> Tekan tombol power -> Tunggu OS loading",
                    "Tunggu OS loading -> Hubungkan ke listrik -> Tekan tombol power"
                ],
                answer: "Hubungkan ke listrik -> Tekan tombol power -> Tunggu OS loading"
            }
        ];

        let currentLevel = 0;
        let score = 0;
        let playerName = "";

        function startGame() {
            const nameInput = document.getElementById("player-name").value.trim();
            if (!nameInput) {
                alert("Harap masukkan nama Anda terlebih dahulu!");
                return;
            }
            playerName = nameInput;
            currentLevel = 0;
            score = 0;
            
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            if (currentLevel >= levels.length) {
                document.getElementById("game-screen").innerHTML = `
                    <h2>Selamat, ${playerName}! 🎉</h2>
                    <p>Anda telah berhasil menyelesaikan semua level informatika dasar!</p>
                    <p><b>Total Skor Akhir: ${score}</b></p>
                    <button onclick="location.reload()">Main Lagi</button>
                `;
                return;
            }

            const lvl = levels[currentLevel];
            document.getElementById("display-level").innerText = `Level: ${currentLevel + 1} / ${levels.length}`;
            document.getElementById("display-score").innerText = `Skor: ${score}`;
            document.getElementById("question-title").innerText = lvl.title;
            document.getElementById("question-text").innerText = lvl.question;

            const optContainer = document.getElementById("options-container");
            optContainer.innerHTML = "";
            
            lvl.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption) {
            const lvl = levels[currentLevel];
            if (selectedOption === lvl.answer) {
                alert("Jawaban Benar! 🎉");
                score += 25;
                currentLevel++;
                loadQuestion();
            } else {
                alert("Jawaban Kurang Tepat. Coba pikirkan lagi!");
            }
        }

        // Fitur Save Game menggunakan localStorage browser
        function saveGame() {
            const saveData = {
                playerName: playerName,
                currentLevel: currentLevel,
                score: score
            };
            localStorage.setItem("informaticsQuestSave", JSON.stringify(saveData));
            alert("Progress game berhasil disimpan! 💾");
        }

        // Fitur Load Game dari localStorage browser
        function loadGame() {
            const savedDataStr = localStorage.getItem("informaticsQuestSave");
            if (!savedDataStr) {
                alert("Tidak ada data save yang ditemukan!");
                return;
            }
            
            const saveData = JSON.parse(savedDataStr);
            playerName = saveData.playerName;
            currentLevel = saveData.currentLevel;
            score = saveData.score;

            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            alert(`Selamat datang kembali, ${playerName}! Melanjutkan dari Level ${currentLevel + 1}.`);
            loadQuestion();
        }
    </script>
</body>
</html>
